<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="readme-screenshot logo">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="22" y="30" width="84" height="56" rx="6"/>
    </clipPath>
  </defs>

  <!-- Browser / README frame -->
  <rect x="14" y="18" width="100" height="84" rx="14" fill="url(#frame)"/>
  <circle cx="30" cy="30" r="3.5" fill="#64748b"/>
  <circle cx="42" cy="30" r="3.5" fill="#64748b"/>
  <circle cx="54" cy="30" r="3.5" fill="#64748b"/>

  <!-- Screenshot area with diagonal light/dark split -->
  <g clip-path="url(#screen)">
    <rect x="22" y="30" width="84" height="56" fill="url(#light)"/>
    <polygon points="22,86 106,30 106,86" fill="url(#dark)"/>
    <!-- Soft blend band -->
    <polygon points="58,86 82,30 90,30 66,86" fill="#94a3b8" opacity="0.35"/>
    <!-- Content bars (light side) -->
    <rect x="30" y="42" width="28" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="30" y="52" width="22" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="30" y="60" width="26" height="4" rx="2" fill="#cbd5e1"/>
    <!-- Content bars (dark side) -->
    <rect x="74" y="52" width="24" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="78" y="62" width="18" height="4" rx="2" fill="#64748b"/>
    <rect x="72" y="70" width="22" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- Camera shutter badge -->
  <circle cx="96" cy="96" r="18" fill="#0ea5e9"/>
  <circle cx="96" cy="96" r="11" fill="none" stroke="#e0f2fe" stroke-width="3"/>
  <circle cx="96" cy="96" r="4.5" fill="#e0f2fe"/>
</svg>

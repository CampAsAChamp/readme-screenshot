name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js validate --config examples/portfolio.readme-screenshot.yml
      - run: node dist/cli.js validate --config examples/fastapi.readme-screenshot.yml

      - name: Verify package version matches tag
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
